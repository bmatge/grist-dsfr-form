services:
  grist-dsfr-form:
    build: .
    container_name: grist-dsfr-form
    restart: unless-stopped

    environment:
      - PORT=3000
      - ALLOWED_HOSTS=grist.numerique.gouv.fr,docs.getgrist.com
      # - DSFR_VERSION=1.14.3

    networks:
      - ecosystem-network

    labels:
      - "traefik.enable=true"

      # HTTP → HTTPS redirect
      - "traefik.http.routers.gristform-http.rule=Host(`gristformproxy.matge.com`)"
      - "traefik.http.routers.gristform-http.entrypoints=web"
      - "traefik.http.routers.gristform-http.middlewares=redirect-to-https"

      # HTTPS router
      - "traefik.http.routers.gristform-https.rule=Host(`gristformproxy.matge.com`)"
      - "traefik.http.routers.gristform-https.entrypoints=websecure"
      - "traefik.http.routers.gristform-https.tls=true"
      - "traefik.http.routers.gristform-https.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gristform-https.tls.options=anssi-strict@file"
      # Middleware custom pour écraser la CSP globale de Traefik
      # (security-headers@file est appliqué au niveau entrypoint)
      - "traefik.http.routers.gristform-https.middlewares=gristform-csp"
      - "traefik.http.middlewares.gristform-csp.headers.customResponseHeaders.Content-Security-Policy=default-src 'self' https://grist.numerique.gouv.fr https://docs.getgrist.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://grist.numerique.gouv.fr https://docs.getgrist.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://grist.numerique.gouv.fr https://docs.getgrist.com https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://cdn.jsdelivr.net; connect-src 'self' https://grist.numerique.gouv.fr https://docs.getgrist.com; form-action 'self' https://grist.numerique.gouv.fr https://docs.getgrist.com; base-uri 'self' https://grist.numerique.gouv.fr https://docs.getgrist.com"

      # Service
      - "traefik.http.services.gristform.loadbalancer.server.port=3000"

      # Redirect middleware
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

networks:
  ecosystem-network:
    external: true
